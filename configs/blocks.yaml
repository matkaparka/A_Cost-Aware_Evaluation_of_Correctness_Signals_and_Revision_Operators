# Block manifest: the single run order across models (design §10; CLAUDE.md §4). Updated for the freeze, 2026-11-05.
# Volumes are planning counts. GPU-hours are computed by analysis/p0_compute.py from the measured P0 rates; nothing
# here is a measured cost (actual costs: cloud/ledger.jsonl).
#
# Test pools (data/processed, data/processed/ext): D-nat original 1,455 (GSM8K 1,055 + MATH-500 400); D-nat expansion
# 3,597 (MATH test outside MATH-500); D-inj 1,635; Exp 0 160 templates. The 4B D-nat estimand pools the original pool
# and the expansion as sampled (DECISIONS 2026-11-05).
#
# Work units:
#   gen       non-thinking vLLM generations (revision-length prompts)
#   think     thinking-mode vLLM generations, counted at the P0 mean length (2,380 tokens); the dev pilot mean at the
#             16,384 budget is 3,079 (reports/03_checks_tables.md), so the item counts below are scaled by 1.3
#   lora_gen  vLLM generations with a per-item LoRA adapter
#   hf_gen    HF generations (steering cannot run in vLLM)
#   fwd       single HF forward passes over a solution-length sequence (activations, proxies, verbal P(yes))
#   fwdbwd    HF forward + backward passes (attribution patching)
#   ttt       TTT LoRA updates (k = 4 steps each)
#   stream    sequential stream steps (generate a0 + verdict, then one update)
# Exp 1A: 13 generation slots per item, an upper bound (verdict conditions that share a verdict value share a
# generation). Exp 1B: 12 per item.
#
# Per block (design §10):
#   chunk     items per complete paired chunk: every condition of those items finishes before the next chunk starts;
#             items run in the seeded order of their split (data/processed/split.json, ext/split_ext.json)
#   min_n     minimum complete sample (items, or templates for Exp 0). Analysis: planned n reached -> as planned;
#             >= min_n -> pre-registered partial-sample analysis, labelled as such; < min_n -> descriptive only
#   stop      every block stops at the session deadline or the budget allowance (CLAUDE.md §6) after the last complete
#             chunk; a stopped block resumes from its last complete chunk at the same locked commit and GPU type
# Atomic blocks: src/exp/runner.py generates every item of a pool in one engine call (4B-exp0, -exp1a and -exp1b are
# one runner call on the original pool), and the Exp 2 block caches every test item; chunk = min_n = planned n, and a
# stopped atomic block is re-run in full at its locked commit. Chunked blocks: min_n from analysis/p3_min_n.py
# (reports/03_min_n_tables.md): the smallest n with central-scenario power >= 0.8 for the block's confirmatory test,
# otherwise half the planned n.

defaults:
